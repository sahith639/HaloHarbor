apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-controller-mongo-db
  namespace: my-app-xlab
spec:
  serviceName: "user-controller-mongo-db"
  replicas: 2
  selector:
    matchLabels:
      app: user-controller-mongo-db
  template:
    metadata:
      labels:
        app: user-controller-mongo-db
    spec:
      containers:
      - name: mongo
        image: mongo:latest
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: controller-mongodb-data  # This is the corrected name
          mountPath: /data/db
      volumes:
      - name: controller-mongodb-data  # Corrected the volume name here
        persistentVolumeClaim:
          claimName: mongo-db-pvc  # Make sure this PVC exists
