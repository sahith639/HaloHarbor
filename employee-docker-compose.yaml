version: "3.9"
name: nsf-demo
services:

  controller:
    build:
      context: "./nsf-user-controller"
      dockerfile: ./demo/Dockerfile
    container_name: user-controller
    ports:
      - 8080:8080
    depends_on:
      - controller_db
      - acapy_agent
    networks:
      - network
    environment:
      AGENT_URL: mongodb://controller_db:27017
      MONGO_DB_URI: http://acapy_agent:8031
  
  controller_db:
    image: mongo:latest
    container_name: user-controller-mongo-db
    ports:
      - 27018:27017
    networks:
      - network
    volumes:
      - mongodb_data:/data/db
  
  acapy_agent:
    build:
      context: "./nsf-acapy"
      dockerfile: ./nsf-demo/nsf-demo.Dockerfile
    container_name: user-acapy-agent
    ports:
      - 8031:8031
      - 8030:8030
    depends_on:
     - acapy_wallet_db
    networks:
      - network
    command: start --arg-file "//user-agent-args.yaml" --wallet-storage-config '{"url":"acapy_wallet_db:5432","max_connections":5, "wallet_scheme":"DatabasePerWallet"}' --wallet-storage-creds '{"account":"postgres","password":"postgres","admin_account":"postgres","admin_password":"postgres"}'
  
  acapy_wallet_db:
    image: postgres:14.1-alpine
    container_name: user-acapy-postgres-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5433:5432
    networks:
      - network
    volumes: 
      - postgres_data:/var/lib/postgresql/data

networks:
  network:
    driver: bridge

volumes:
  mongodb_data:
  postgres_data:
    driver: local
